<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Open the shared video directly in Google Drive.">
  <meta property="og:title" content="Open Video in Google Drive">
  <meta property="og:description" content="Open the shared video directly in Google Drive.">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">
  <title>Open Video in Google Drive</title>
  <style>
    :root {
      color-scheme: light;
      --background: oklch(0.985 0.012 155);
      --foreground: oklch(0.2 0.025 250);
      --card: oklch(1 0 0);
      --primary: oklch(0.52 0.15 148);
      --primary-foreground: oklch(0.99 0.006 145);
      --secondary: oklch(0.94 0.035 150);
      --muted: oklch(0.49 0.025 250);
      --border: oklch(0.9 0.02 155);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 20px;
      background: var(--background);
      color: var(--foreground);
      font-family: ui-sans-serif, system-ui, sans-serif;
    }
    main {
      width: min(100%, 384px);
      padding: 36px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--card);
      text-align: center;
      box-shadow: 0 2px 12px oklch(0.2 0.025 250 / 0.06);
    }
    .icon {
      display: grid;
      width: 64px;
      height: 64px;
      margin: 0 auto 24px;
      place-items: center;
      border-radius: 50%;
      background: var(--secondary);
      color: var(--primary);
    }
    .icon svg { width: 36px; height: 36px; }
    .eyebrow {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    h1 { margin: 0; font-size: 24px; line-height: 1.25; }
    .description { margin: 12px 0 0; color: var(--muted); font-size: 14px; line-height: 1.7; }
    .open-link {
      display: flex;
      min-height: 48px;
      margin-top: 28px;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-radius: 6px;
      background: var(--primary);
      color: var(--primary-foreground);
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      transition: filter 160ms ease;
    }
    .open-link:hover { filter: brightness(.94); }
    .open-link:focus-visible { outline: 3px solid var(--primary); outline-offset: 3px; }
    .open-link svg { width: 18px; height: 18px; }
    @media (max-width: 420px) { main { padding: 30px 24px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.25"/><path d="m10 8.5 5.5 3.5-5.5 3.5z"/></svg>
    </div>
    <p class="eyebrow">Your video</p>
    <h1>Ready to watch</h1>
    <p class="description">Open the shared video directly in Google Drive.</p>
    <a class="open-link" href="https://drive.google.com/file/d/1qcrhfSDIo6gnX6QUwDdaR3GG9mgqwbc0/view" target="_blank" rel="noopener noreferrer">
      Open Google Drive
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M7 7h10v10"/></svg>
    </a>
  </main>
</body>
</html>
